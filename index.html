<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T3 Code Themes · live player</title>
<meta name="description" content="Animated themes for T3 Code, drawn in code. Play them live or use one as a desktop wallpaper.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; color: #fff; }
  #stage, #stage iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #stage iframe { pointer-events: none; }
  #title { position: fixed; left: 0; right: 0; top: 18vh; height: 140px; pointer-events: none; }
  #title iframe { width: 100%; height: 100%; border: 0; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 8px; border-radius: 14px;
         background: rgba(12, 12, 18, .62); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 8px 30px rgba(0, 0, 0, .35); max-width: calc(100vw - 32px); overflow-x: auto; transition: opacity .4s; }
  #bar button { all: unset; cursor: pointer; border-radius: 9px; }
  #bar .t { width: 72px; height: 45px; background-size: cover; background-position: center; outline: 2px solid transparent; outline-offset: 1px; flex: none; }
  #bar .t[aria-pressed="true"] { outline-color: #fff; }
  #bar .t:focus-visible, #bar .b:focus-visible { outline: 2px solid #8cf; }
  #bar .b { padding: 8px 12px; background: rgba(255, 255, 255, .1); white-space: nowrap; font-weight: 600; font-size: 12px; }
  #name { position: fixed; left: 20px; bottom: 22px; font-weight: 600; text-shadow: 0 1px 8px rgba(0, 0, 0, .6); transition: opacity .4s; }
  #name small { display: block; font-weight: 400; opacity: .8; }
  body.clean #bar, body.clean #name { display: none; }
  body.idle #bar, body.idle #name { opacity: 0; }
  @media (max-width: 760px) { #name { display: none; } #bar .t { width: 56px; height: 35px; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="title"></div>
<div id="name"></div>
<nav id="bar" aria-label="Themes"></nav>
<script src="player/sandbox.js"></script>
<script>
(async function () {
  var IDS = ['cozy-room', 'meadow-breeze', 'koi-pond', 'silk-flow', 'rainy-cafe', 'portal-lab', 'playground'];
  var q = new URLSearchParams(location.search);
  var clean = q.has('clean') || q.has('wallpaper');           // ?wallpaper hides every control
  var showTitle = q.has('title') ? q.get('title') !== '0' : !clean;
  var cycle = Number(q.get('cycle')) || 0;                     // ?cycle=20 switches theme every 20 s
  if (clean) document.body.classList.add('clean');
  var stage = document.getElementById('stage'), titleBox = document.getElementById('title'), bar = document.getElementById('bar'), nameEl = document.getElementById('name');
  var cache = {}, scene = null, comp = null, title = null, current = null;

  async function load(id) {
    if (cache[id]) return cache[id];
    var base = 'themes/' + id + '/';
    var r = await Promise.all([fetch(base + 'theme.json').then(function (x) { return x.json(); }), fetch(base + 'scene.js').then(function (x) { return x.text(); }), fetch(base + 'welcome.js').then(function (x) { return x.text(); }).catch(function () { return ''; })]);
    return (cache[id] = { theme: r[0], scene: r[1], welcome: r[2] });
  }
  function palette(t) { var o = Object.assign({}, t.palette || {}); o.scene = t.sceneColors || []; return o; }

  async function show(id) {
    var item = await load(id), t = item.theme; current = id;
    if (scene) scene.destroy(); if (comp) comp.destroy(); if (title) title.destroy(); title = comp = null;
    var params = (t.scene && t.scene.params) || {};
    scene = T3SkinSandbox.create({ code: item.scene, kind: 'scene', palette: palette(t), params: params, light: t.appearance === 'light',
      motion: 'live', fps: 30, dpr: Math.min(devicePixelRatio || 1, 2), width: innerWidth, height: innerHeight, run: true, zones: [], t0: 8, budgetMs: 40 });
    stage.replaceChildren(scene.el);
    // themes with a companion (Cozy Room's cat) draw it in a second, click-through layer above the scene
    if (params.companion === true) {
      comp = T3SkinSandbox.create({ code: item.scene, kind: 'scene', layer: 'companion', palette: palette(t), params: params, light: t.appearance === 'light',
        motion: 'live', fps: 60, dpr: Math.min(devicePixelRatio || 1, 2), width: innerWidth, height: innerHeight, run: true, zones: [], t0: 0, budgetMs: 40 });
      comp.el.style.position = 'absolute'; comp.el.style.inset = '0'; comp.el.style.pointerEvents = 'none'; stage.append(comp.el);
    }
    if (showTitle && item.welcome && t.welcome && params.companion !== true) {   // Cozy Room's neon sign is already in the room
      title = T3SkinSandbox.create({ code: item.welcome, kind: 'welcome', palette: palette(t), params: t.welcome.params || {}, text: t.welcome.text || t.name, light: t.appearance === 'light',
        motion: 'live', fps: 30, dpr: Math.min(devicePixelRatio || 1, 2), width: innerWidth, height: 140, run: true, t0: 0, budgetMs: 20 });
      titleBox.replaceChildren(title.el);
    } else titleBox.replaceChildren();
    document.title = t.name + ' · T3 Code Themes';
    nameEl.innerHTML = ''; nameEl.append(t.name); var s = document.createElement('small'); s.textContent = t.tagline || ''; nameEl.append(s);
    bar.querySelectorAll('.t').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.id === id)); });
    var u = new URL(location.href); u.searchParams.set('theme', id); history.replaceState(null, '', u);
  }

  IDS.forEach(function (id) {
    var b = document.createElement('button'); b.className = 't'; b.dataset.id = id; b.style.backgroundImage = 'url(themes/' + id + '/thumb.jpg)';
    b.setAttribute('aria-label', id.replace(/-/g, ' ')); b.onclick = function () { show(id); }; bar.append(b);
  });
  var tb = document.createElement('button'); tb.className = 'b'; tb.textContent = 'Title on/off';
  tb.onclick = function () { showTitle = !showTitle; show(current); }; bar.append(tb);
  var fb = document.createElement('button'); fb.className = 'b'; fb.textContent = 'Full screen';
  fb.onclick = function () { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }; bar.append(fb);

  addEventListener('resize', function () { if (scene) scene.resize(innerWidth, innerHeight); if (comp) comp.resize(innerWidth, innerHeight); if (title) title.resize(innerWidth, 140); });
  ['pointermove', 'pointerdown', 'pointerup'].forEach(function (type) {
    addEventListener(type, function (e) {
      var over = !!(e.target.closest && e.target.closest('#bar'));
      var ev = { type: 'pointer', kind: type === 'pointerdown' ? 'down' : type === 'pointerup' ? 'up' : 'move', x: e.clientX, y: e.clientY, overUI: over, inside: true };
      if (scene) scene.pointer(ev); if (comp) comp.pointer(ev);
      idle();
    });
  });
  var idleTimer = 0; function idle() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3500); }
  idle();
  if (cycle > 0) setInterval(function () { show(IDS[(IDS.indexOf(current) + 1) % IDS.length]); }, cycle * 1000);

  var start = q.get('theme'); show(IDS.indexOf(start) >= 0 ? start : IDS[0]);
})();
</script>
</body>
</html>
